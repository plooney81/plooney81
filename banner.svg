      <stop offset="0" stop-color="#0e0b1a"/>
      <stop offset="1" stop-color="#160f2e"/>
    </linearGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="12" cy="12" r="1" fill="#9d7eff" fill-opacity="0.08"/>
